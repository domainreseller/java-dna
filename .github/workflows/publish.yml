# Publishes the SDK to Maven Central when a GitHub release is published.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD
#       a user token from https://central.sonatype.com (Account -> Generate User Token),
#       for an account that owns the io.github.domainreseller namespace
#   GPG_PRIVATE_KEY   armored secret key: gpg --armor --export-secret-keys <KEY_ID>
#   GPG_PASSPHRASE    its passphrase
# The public half of the key must be on a public key server, for example
#   gpg --keyserver keyserver.ubuntu.com --send-keys <KEY_ID>

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Read the version
        id: version
        run: |
          v=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "release" ] && [ "$tag" != "$v" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match pom.xml version $v"
            exit 1
          fi

      - name: Skip when this version is already on Maven Central
        id: check
        run: |
          url="https://repo1.maven.org/maven2/io/github/domainreseller/domainnameapi/${{ steps.version.outputs.version }}/"
          if curl -sfI "$url" >/dev/null; then
            echo "Version ${{ steps.version.outputs.version }} is already on Maven Central, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and publish
        if: steps.check.outputs.skip != 'true'
        run: mvn -B -Prelease deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
